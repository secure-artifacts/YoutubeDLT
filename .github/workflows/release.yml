name: Build and Release (Windows + macOS)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号 (例如: v2.0.0)'
        required: true
        default: 'v2.0.0'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest]

    permissions:
      id-token: write
      contents: write
      attestations: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~\AppData\Local\pip\Cache
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Install ffmpeg
        run: |
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            choco install ffmpeg -y --no-progress
          else
            brew install ffmpeg
          fi

      # ==================== Windows 构建（尽量保持你原来成功的写法） ====================
      - name: Build Windows EXE
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          pyinstaller `
            --noconfirm `
            --clean `
            --onefile `
            --windowed `
            --name YoutubeDLT `
            --icon app_icon.ico `          # ← Windows 使用你本地的图标
            --hidden-import yt_dlp `
            --hidden-import PyQt6.QtWidgets `
            --hidden-import PyQt6.QtCore `
            --hidden-import PyQt6.QtGui `
            --hidden-import PyQt6.QtNetwork `
            --hidden-import PyQt6.sip `
            --hidden-import certifi `
            --collect-all yt_dlp `
            --collect-all PyQt6 `
            main.py

          mkdir -p dist_final
          Move-Item -Path dist/YoutubeDLT.exe -Destination dist_final/YoutubeDLT-Windows.exe -Force

      # ==================== macOS 构建（不使用图标） ====================
      - name: Build macOS App + DMG
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -e

          pyinstaller \
            --noconfirm \
            --clean \
            --onefile \
            --windowed \
            --name YoutubeDLT \
            --hidden-import yt_dlp \
            --hidden-import PyQt6.QtWidgets \
            --hidden-import PyQt6.QtCore \
            --hidden-import PyQt6.QtGui \
            --hidden-import PyQt6.QtNetwork \
            --hidden-import PyQt6.sip \
            --hidden-import certifi \
            --collect-all yt_dlp \
            --collect-all PyQt6 \
            --target-arch arm64 \
            main.py

          # 打包成 DMG（无图标版本）
          brew install create-dmg

          mkdir -p dist_final dist_temp
          cp -R dist/YoutubeDLT.app dist_temp/

          create-dmg \
            --volname "YoutubeDLT" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --hide-extension "YoutubeDLT.app" \
            --app-drop-link 425 120 \
            --no-internet-enable \
            "dist_final/YoutubeDLT-macOS.dmg" \
            "dist_temp/"

      - name: Generate Build Provenance
        uses: actions/attest@v4
        with:
          subject-path: 'dist_final/*'

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: YoutubeDLT-${{ runner.os }}
          path: dist_final/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release + Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version || github.ref_name }}
          files: |
            artifacts/YoutubeDLT-Windows.exe
            artifacts/YoutubeDLT-macOS.dmg
          name: ${{ github.event.inputs.version || github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: false
          make_latest: true
          overwrite: true
