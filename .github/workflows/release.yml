name: Build and Release (Windows + macOS)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号 (例如: v2.0.0)'
        required: true
        default: 'v2.0.0'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    permissions:
      id-token: write
      contents: write
      attestations: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~\AppData\Local\pip\Cache
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Install ffmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress

      - name: Install ffmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg

      - name: Build Single EXE/App + DMG
        shell: bash
        run: |
          set -e  # 遇到错误立即退出

          if [[ "${{ runner.os }}" == "Windows" ]]; then
            echo "=== Building for Windows ==="

            powershell -NoProfile -Command "
              pyinstaller `
                --noconfirm `
                --clean `
                --onefile `
                --windowed `
                --name YoutubeDLT `
                --hidden-import yt_dlp `
                --hidden-import PyQt6.QtWidgets `
                --hidden-import PyQt6.QtCore `
                --hidden-import PyQt6.QtGui `
                --hidden-import PyQt6.QtNetwork `
                --hidden-import PyQt6.sip `
                --hidden-import certifi `
                --collect-all yt_dlp `
                --collect-all PyQt6 `
                main.py
            "

            mkdir -p dist_final
            mv dist/YoutubeDLT.exe dist_final/YoutubeDLT-Windows.exe

          else
            echo "=== Building for macOS (arm64) ==="

            pyinstaller \
              --noconfirm \
              --clean \
              --onefile \
              --windowed \
              --name YoutubeDLT \
              --hidden-import yt_dlp \
              --hidden-import PyQt6.QtWidgets \
              --hidden-import PyQt6.QtCore \
              --hidden-import PyQt6.QtGui \
              --hidden-import PyQt6.QtNetwork \
              --hidden-import PyQt6.sip \
              --hidden-import certifi \
              --collect-all yt_dlp \
              --collect-all PyQt6 \
              --target-arch arm64 \
              main.py

            # 打包 DMG
            brew install create-dmg

            mkdir -p dist_final dist_temp
            cp -R dist/YoutubeDLT.app dist_temp/

            create-dmg \
              --volname "YoutubeDLT" \
              --window-pos 200 120 \
              --window-size 600 400 \
              --icon-size 100 \
              --icon "YoutubeDLT.app" 175 120 \
              --hide-extension "YoutubeDLT.app" \
              --app-drop-link 425 120 \
              --no-internet-enable \
              "dist_final/YoutubeDLT-macOS.dmg" \
              "dist_temp/"
          fi

      - name: Generate Build Provenance
        uses: actions/attest@v4
        with:
          subject-path: 'dist_final/*'

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: YoutubeDLT-${{ runner.os }}
          path: dist_final/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release + Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version || github.ref_name }}
          files: |
            artifacts/YoutubeDLT-Windows.exe
            artifacts/YoutubeDLT-macOS.dmg
          name: ${{ github.event.inputs.version || github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: false
          make_latest: true
          overwrite: true
