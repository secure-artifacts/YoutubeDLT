name: Build and Release (Windows + macOS + Linux)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号 (例如: v2.0.0)'
        required: true
        default: 'v2.0.0'
      build_debug:
        description: '是否同时构建 Debug 版本（仅测试时勾选）'
        type: boolean
        required: false
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
      max-parallel: 1
    permissions:
      id-token: write
      contents: write
      attestations: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~\AppData\Local\pip\Cache
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      # ==================== Install ffmpeg ====================
      - name: Install ffmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress

      - name: Install ffmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg

      - name: Install ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fuse3

      # ==================== Windows ====================
      - name: Build Windows Normal (No Console)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          python -m PyInstaller `
            --noconfirm --clean --onefile --windowed `
            --name YoutubeDLT `
            --icon app_icon.ico `
            --hidden-import yt_dlp `
            --hidden-import PyQt6.QtWidgets `
            --hidden-import PyQt6.QtCore `
            --hidden-import PyQt6.QtGui `
            --hidden-import PyQt6.QtNetwork `
            --hidden-import PyQt6.sip `
            --hidden-import certifi `
            --collect-all yt_dlp `
            --collect-all PyQt6 `
            --add-binary "C:/ProgramData/chocolatey/bin/ffmpeg.exe;ffmpeg" `
            --add-binary "C:/ProgramData/chocolatey/bin/ffprobe.exe;ffmpeg" `
            --debug=all main.py
          mkdir -p dist_final
          Move-Item -Path dist/YoutubeDLT.exe -Destination dist_final/YoutubeDLT-Windows.exe -Force

      - name: Build Windows Debug (With Console)
        if: runner.os == 'Windows' && inputs.build_debug == true
        shell: powershell
        run: |
          python -m PyInstaller `
            --noconfirm --clean --onefile --console `
            --name YoutubeDLT-Debug `
            --icon app_icon.ico `
            --hidden-import yt_dlp `
            --hidden-import PyQt6.QtWidgets `
            --hidden-import PyQt6.QtCore `
            --hidden-import PyQt6.QtGui `
            --hidden-import PyQt6.QtNetwork `
            --hidden-import PyQt6.sip `
            --hidden-import certifi `
            --collect-all yt_dlp `
            --collect-all PyQt6 `
            --add-binary "C:/ProgramData/chocolatey/bin/ffmpeg.exe;ffmpeg" `
            --add-binary "C:/ProgramData/chocolatey/bin/ffprobe.exe;ffmpeg" `
            --debug=all main.py
          Move-Item -Path dist/YoutubeDLT-Debug.exe -Destination dist_final/YoutubeDLT-Windows-Debug.exe -Force

      # ==================== macOS ====================
      - name: Build macOS Normal
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -e
          pyinstaller \
            --noconfirm --clean --onefile --windowed \
            --name YoutubeDLT \
            --hidden-import yt_dlp \
            --hidden-import PyQt6.QtWidgets \
            --hidden-import PyQt6.QtCore \
            --hidden-import PyQt6.QtGui \
            --hidden-import PyQt6.QtNetwork \
            --hidden-import PyQt6.sip \
            --hidden-import certifi \
            --collect-all yt_dlp \
            --collect-all PyQt6 \
            --target-arch arm64 \
            --add-binary "$(which ffmpeg):." \
            --debug=all main.py

          brew install create-dmg
          mkdir -p dist_final dist_temp
          cp -R dist/YoutubeDLT.app dist_temp/
          create-dmg \
            --volname "YoutubeDLT" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --hide-extension "YoutubeDLT.app" \
            --app-drop-link 425 120 \
            --no-internet-enable \
            "dist_final/YoutubeDLT-macOS.dmg" \
            "dist_temp/"

      - name: Build macOS Debug
        if: runner.os == 'macOS' && inputs.build_debug == true
        shell: bash
        run: |
          set -e
          pyinstaller \
            --noconfirm --clean --onefile --console \
            --name YoutubeDLT-Debug \
            --hidden-import yt_dlp \
            --hidden-import PyQt6.QtWidgets \
            --hidden-import PyQt6.QtCore \
            --hidden-import PyQt6.QtGui \
            --hidden-import PyQt6.QtNetwork \
            --hidden-import PyQt6.sip \
            --hidden-import certifi \
            --collect-all yt_dlp \
            --collect-all PyQt6 \
            --target-arch arm64 \
            --add-binary "$(which ffmpeg):." \
            --debug=all main.py
          mkdir -p dist_final
          cp dist/YoutubeDLT-Debug dist_final/YoutubeDLT-macOS-Debug
          chmod +x dist_final/YoutubeDLT-macOS-Debug

      # ==================== Linux AppImage (已修复) ====================
      - name: Build Linux AppImage
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -e
          echo "=== Building Linux AppImage ==="

          pyinstaller \
            --noconfirm --clean --onefile --windowed \
            --name YoutubeDLT \
            --hidden-import yt_dlp \
            --hidden-import PyQt6.QtWidgets \
            --hidden-import PyQt6.QtCore \
            --hidden-import PyQt6.QtGui \
            --hidden-import PyQt6.QtNetwork \
            --hidden-import PyQt6.sip \
            --hidden-import certifi \
            --collect-all yt_dlp \
            --collect-all PyQt6 \
            --add-binary "$(which ffmpeg):." \
            --add-binary "$(which ffprobe):." \
            --debug=all main.py

          # Prepare AppDir
          mkdir -p AppDir/usr/bin
          cp dist/YoutubeDLT AppDir/usr/bin/
          chmod +x AppDir/usr/bin/YoutubeDLT

          # Create desktop file
          cat > AppDir/YoutubeDLT.desktop << EOF
          [Desktop Entry]
          Name=YoutubeDLT
          Exec=YoutubeDLT
          Icon=YoutubeDLT
          Type=Application
          Categories=Utility;AudioVideo;Network;
          Terminal=false
          Comment=YouTube Downloader GUI
          EOF

          # Copy icon (优先使用 YoutubeDLT.png)
          if [ -f "YoutubeDLT.png" ]; then
            cp YoutubeDLT.png AppDir/YoutubeDLT.png
            echo "✓ Icon copied: YoutubeDLT.png"
          elif [ -f "app_icon.png" ]; then
            cp app_icon.png AppDir/YoutubeDLT.png
            echo "✓ Icon copied: app_icon.png"
          else
            echo "⚠️ Warning: No icon found!"
          fi

          # Build AppImage
          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          ./appimagetool-x86_64.AppImage AppDir YoutubeDLT-Linux-x86_64.AppImage

          mkdir -p dist_final
          mv YoutubeDLT-Linux-x86_64.AppImage dist_final/
          chmod +x dist_final/YoutubeDLT-Linux-x86_64.AppImage

      # ==================== Linux Debug ====================
      - name: Build Linux Debug
        if: runner.os == 'Linux' && inputs.build_debug == true
        shell: bash
        run: |
          set -e
          pyinstaller \
            --noconfirm --clean --onefile --console \
            --name YoutubeDLT-Debug \
            --hidden-import yt_dlp \
            --hidden-import PyQt6.QtWidgets \
            --hidden-import PyQt6.QtCore \
            --hidden-import PyQt6.QtGui \
            --hidden-import PyQt6.QtNetwork \
            --hidden-import PyQt6.sip \
            --hidden-import certifi \
            --collect-all yt_dlp \
            --collect-all PyQt6 \
            --add-binary "$(which ffmpeg):." \
            --add-binary "$(which ffprobe):." \
            --debug=all main.py

          mkdir -p dist_final
          cp dist/YoutubeDLT-Debug dist_final/YoutubeDLT-Linux-x86_64-Debug
          chmod +x dist_final/YoutubeDLT-Linux-x86_64-Debug

      - name: Generate Build Provenance
        uses: actions/attest@v4
        with:
          subject-path: 'dist_final/*'

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: YoutubeDLT-${{ runner.os }}
          path: dist_final/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release + Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version || github.ref_name }}
          files: |
            artifacts/YoutubeDLT-Windows.exe
            artifacts/YoutubeDLT-macOS.dmg
            artifacts/YoutubeDLT-Linux-x86_64.AppImage
            artifacts/YoutubeDLT-Windows-Debug.exe
            artifacts/YoutubeDLT-macOS-Debug
            artifacts/YoutubeDLT-Linux-x86_64-Debug
          name: ${{ github.event.inputs.version || github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: false
          make_latest: true
          overwrite: true
