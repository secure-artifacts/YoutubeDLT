name: Build and Release (Windows + macOS + Linux)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号 (例如: v2.0.0)'
        required: true
        default: 'v2.0.0'
      build_debug:
        description: '是否同时构建 Debug 版本（仅测试时勾选）'
        type: boolean
        required: false
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
      max-parallel: 1
    permissions:
      id-token: write
      contents: write
      attestations: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~\AppData\Local\pip\Cache
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      # ==================== Install ffmpeg ====================
      - name: Install ffmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress

      - name: Install ffmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg

      - name: Download Static FFmpeg (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p ffmpeg-static
          cd ffmpeg-static
          wget -q https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz
          tar -xf ffmpeg-release-amd64-static.tar.xz

      # ==================== Windows (恢复稳定版) ====================
      - name: Build Windows Normal
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          python -m PyInstaller `
            --noconfirm --clean --onefile --windowed `
            --name YoutubeDLT `
            --icon app_icon.ico `
            --hidden-import yt_dlp `
            --hidden-import PyQt6.QtWidgets `
            --hidden-import PyQt6.QtCore `
            --hidden-import PyQt6.QtGui `
            --hidden-import PyQt6.QtNetwork `
            --hidden-import PyQt6.sip `
            --hidden-import certifi `
            --collect-all yt_dlp `
            --collect-all PyQt6 `
            --add-binary "C:/ProgramData/chocolatey/bin/ffmpeg.exe;." `
            --add-binary "C:/ProgramData/chocolatey/bin/ffprobe.exe;." `
            --debug=all main.py
          mkdir -p dist_final
          Move-Item -Path dist/YoutubeDLT.exe -Destination dist_final/YoutubeDLT-Windows.exe -Force

      - name: Build Windows Debug
        if: runner.os == 'Windows' && inputs.build_debug == true
        shell: powershell
        run: |
          python -m PyInstaller `
            --noconfirm --clean --onefile --console `
            --name YoutubeDLT-Debug `
            --icon app_icon.ico `
            --hidden-import yt_dlp `
            --hidden-import PyQt6.QtWidgets `
            --hidden-import PyQt6.QtCore `
            --hidden-import PyQt6.QtGui `
            --hidden-import PyQt6.QtNetwork `
            --hidden-import PyQt6.sip `
            --hidden-import certifi `
            --collect-all yt_dlp `
            --collect-all PyQt6 `
            --add-binary "C:/ProgramData/chocolatey/bin/ffmpeg.exe;." `
            --add-binary "C:/ProgramData/chocolatey/bin/ffprobe.exe;." `
            --debug=all main.py
          mkdir -p dist_final
          Move-Item -Path dist/YoutubeDLT-Debug.exe -Destination dist_final/YoutubeDLT-Windows-Debug.exe -Force

      # ==================== macOS ====================
      - name: Build macOS Normal
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -e
          pyinstaller --noconfirm --clean --onefile --windowed \
            --name YoutubeDLT \
            --hidden-import yt_dlp \
            --hidden-import PyQt6.QtWidgets \
            --hidden-import PyQt6.QtCore \
            --hidden-import PyQt6.QtGui \
            --hidden-import PyQt6.QtNetwork \
            --hidden-import PyQt6.sip \
            --hidden-import certifi \
            --collect-all yt_dlp \
            --collect-all PyQt6 \
            --target-arch arm64 \
            --add-binary "$(which ffmpeg):." main.py

          brew install create-dmg
          mkdir -p dist_final dist_temp
          cp -R dist/YoutubeDLT.app dist_temp/
          create-dmg --volname "YoutubeDLT" --window-pos 200 120 --window-size 600 400 --icon-size 100 \
            --hide-extension "YoutubeDLT.app" --app-drop-link 425 120 --no-internet-enable \
            "dist_final/YoutubeDLT-macOS.dmg" "dist_temp/"

      # ==================== Linux Onedir (稳定解决 Qt xcb) ====================
      - name: Build Linux (onedir)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -e
          echo "=== Building Linux Onedir ==="

          FFMPEG_DIR=$(find ffmpeg-static -type d -name "ffmpeg-*-static" | head -n1)
          PYQT6_PLUGINS=$(python -c "import PyQt6.QtCore; import os; print(os.path.dirname(PyQt6.QtCore.__file__) + '/../../Qt6/plugins')")

          pyinstaller \
            --noconfirm --clean \
            --onedir --windowed \
            --name YoutubeDLT \
            --hidden-import yt_dlp \
            --hidden-import PyQt6.QtWidgets \
            --hidden-import PyQt6.QtCore \
            --hidden-import PyQt6.QtGui \
            --hidden-import PyQt6.QtNetwork \
            --hidden-import PyQt6.sip \
            --hidden-import certifi \
            --collect-all yt_dlp \
            --collect-all PyQt6 \
            --collect-all Qt6 \
            --add-binary "$FFMPEG_DIR/ffmpeg:." \
            --add-binary "$FFMPEG_DIR/ffprobe:." \
            --add-data "$PYQT6_PLUGINS/platforms:PyQt6/Qt6/plugins/platforms" \
            --add-data "$PYQT6_PLUGINS/xcbglintegrations:PyQt6/Qt6/plugins/xcbglintegrations" main.py

          mkdir -p dist_final
          cd dist
          tar -czf YoutubeDLT-Linux-x86_64.tar.gz YoutubeDLT
          mv YoutubeDLT-Linux-x86_64.tar.gz ../dist_final/

          cat > ../dist_final/README-Linux.txt << EOF
          【YoutubeDLT Linux 使用说明】

          1. 解压：
             tar -xzf YoutubeDLT-Linux-x86_64.tar.gz

          2. 运行：
             cd YoutubeDLT
             chmod +x YoutubeDLT
             ./YoutubeDLT
          EOF

      - name: Generate Build Provenance
        uses: actions/attest@v4
        with:
          subject-path: 'dist_final/*'

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: YoutubeDLT-${{ runner.os }}
          path: dist_final/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version || github.ref_name }}
          files: |
            artifacts/YoutubeDLT-Windows.exe
            artifacts/YoutubeDLT-macOS.dmg
            artifacts/YoutubeDLT-Linux-x86_64.tar.gz
          name: ${{ github.event.inputs.version || github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: false
          make_latest: true
          overwrite: true
